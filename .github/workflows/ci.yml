name: CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23', '1.24']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests with coverage
        run: |
          go test -v -race -coverprofile=coverage-unit.txt -covermode=atomic -coverpkg=./internal/...,./pkg/... ./tests/config ./tests/content ./tests/drivers ./tests/schema
        continue-on-error: false

      - name: Run basic integration test with coverage
        run: |
          go test -v -race -coverprofile=coverage-integration-basic.txt -covermode=atomic -coverpkg=./internal/...,./pkg/... ./tests -run 'TestIntegration_FullWorkflow|TestIntegration_WithConfig'
        continue-on-error: false

      - name: Merge coverage files
        if: matrix.go-version == '1.24'
        run: |
          # Merge coverage files using go tool cover
          echo "mode: atomic" > coverage.txt
          grep -h -v "^mode:" coverage-unit.txt coverage-integration-basic.txt >> coverage.txt || true
        continue-on-error: false

      - name: Verify coverage file exists
        if: matrix.go-version == '1.24'
        run: |
          if [ ! -f coverage.txt ]; then
            echo "Error: coverage.txt not found"
            exit 1
          fi
          echo "Coverage file size: $(wc -l < coverage.txt) lines"
          head -5 coverage.txt

      - name: Upload coverage artifact for merging
        if: matrix.go-version == '1.24'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-${{ github.run_id }}
          path: coverage.txt
          retention-days: 1

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Download dependencies
        run: go mod download

      - name: Run testcontainers integration tests
        run: |
          go test -v -timeout=20m -coverprofile=coverage-integration.txt -covermode=atomic -coverpkg=./internal/...,./pkg/... ./tests -run 'TestIntegration_MySQL_FullWorkflow|TestIntegration_PostgreSQL_FullWorkflow|TestIntegration_AllReportsGenerated'
        continue-on-error: false

      - name: Verify integration coverage file exists
        run: |
          if [ ! -f coverage-integration.txt ]; then
            echo "Error: coverage-integration.txt not found"
            exit 1
          fi
          echo "Coverage file size: $(wc -l < coverage-integration.txt) lines"
          head -5 coverage-integration.txt

      - name: Upload coverage artifact for merging
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-${{ github.run_id }}
          path: coverage-integration.txt
          retention-days: 1

      - name: Upload coverage reports to Codecov (integration-tests flag)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-integration.txt
          flags: integration-tests
          name: integration-tests-coverage
          fail_ci_if_error: true

  coverage-merge:
    name: Merge and Upload Overall Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      - name: Download unit test coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit-${{ github.run_id }}
          path: coverage-artifacts

      - name: Download integration test coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration-${{ github.run_id }}
          path: coverage-artifacts

      - name: Merge all coverage files
        run: |
          echo "mode: atomic" > coverage-combined.txt
          # Merge all coverage files, removing duplicate mode lines
          find coverage-artifacts -type f -name "*.txt" -exec grep -h -v "^mode:" {} \; | sort -u >> coverage-combined.txt || true
          echo "Combined coverage file size: $(wc -l < coverage-combined.txt) lines"
          echo "Coverage percentage:"
          go tool cover -func=coverage-combined.txt | grep total

      - name: Upload overall coverage to Codecov (no flags for badge)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-combined.txt
          name: overall-coverage
          fail_ci_if_error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      - name: Run linter
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m --out-format=colored-line-number

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: go build -v ./cmd/deepdiffdb

      - name: Test binary
        run: |
          ./deepdiffdb --help || true
          ./deepdiffdb help || true
