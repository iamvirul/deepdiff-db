name: CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23', '1.24']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests (no Docker required)
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./internal/...,./pkg/... ./tests/config ./tests/content ./tests/drivers ./tests/schema
        continue-on-error: false

      - name: Run basic integration test (SQLite, no Docker)
        run: |
          go test -v -race ./tests -run 'TestIntegration_FullWorkflow|TestIntegration_WithConfig'
        continue-on-error: false

      - name: Verify coverage file exists
        if: matrix.go-version == '1.24'
        run: |
          if [ ! -f coverage.txt ]; then
            echo "Error: coverage.txt not found"
            exit 1
          fi
          echo "Coverage file size: $(wc -l < coverage.txt) lines"
          head -5 coverage.txt

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.go-version == '1.24'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: unit-tests
          name: unit-tests-coverage
          fail_ci_if_error: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Download dependencies
        run: go mod download

      - name: Run testcontainers integration tests
        run: |
          go test -v -timeout=20m -coverprofile=coverage-integration.txt -covermode=atomic -coverpkg=./internal/...,./pkg/... ./tests -run 'TestIntegration_MySQL_FullWorkflow|TestIntegration_PostgreSQL_FullWorkflow|TestIntegration_AllReportsGenerated'
        continue-on-error: false

      - name: Verify integration coverage file exists
        run: |
          if [ ! -f coverage-integration.txt ]; then
            echo "Error: coverage-integration.txt not found"
            exit 1
          fi
          echo "Coverage file size: $(wc -l < coverage-integration.txt) lines"
          head -5 coverage-integration.txt

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-integration.txt
          flags: integration-tests
          name: integration-tests-coverage
          fail_ci_if_error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      - name: Run linter
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m --out-format=colored-line-number

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: go build -v ./cmd/deepdiffdb

      - name: Test binary
        run: |
          ./deepdiffdb --help || true
          ./deepdiffdb help || true
