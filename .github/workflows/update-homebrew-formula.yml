name: Update Homebrew Formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to update formula for (e.g., v0.7)'
        required: true
        type: string

jobs:
  update-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Updating formula for version: $VERSION"

      - name: Calculate SHA256
        id: sha256
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARBALL_URL="https://github.com/iamvirul/deepdiff-db/archive/refs/tags/${VERSION}.tar.gz"

          echo "Downloading tarball from: $TARBALL_URL"

          # Download and calculate SHA256
          SHA256=$(curl -sL "$TARBALL_URL" | shasum -a 256 | cut -d' ' -f1)

          if [ -z "$SHA256" ]; then
            echo "Error: Failed to calculate SHA256"
            exit 1
          fi

          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "tarball_url=$TARBALL_URL" >> $GITHUB_OUTPUT
          echo "Calculated SHA256: $SHA256"

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARBALL_URL="${{ steps.sha256.outputs.tarball_url }}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"

          echo "Updating Formula/deepdiff-db.rb..."

          # Update URL and SHA256 in the formula
          sed -i "s|url \"https://github.com/iamvirul/deepdiff-db/archive/refs/tags/v[^\"]*\"|url \"$TARBALL_URL\"|" Formula/deepdiff-db.rb
          sed -i "s|sha256 \"[^\"]*\"|sha256 \"$SHA256\"|" Formula/deepdiff-db.rb

          echo "Formula updated successfully"
          cat Formula/deepdiff-db.rb

      - name: Verify formula changes
        run: |
          if git diff --exit-code Formula/deepdiff-db.rb; then
            echo "Warning: No changes detected in formula"
          else
            echo "Changes detected in formula:"
            git diff Formula/deepdiff-db.rb
          fi

      - name: Commit and push changes
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          git add Formula/deepdiff-db.rb

          if git diff --cached --exit-code; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(homebrew): Update formula to $VERSION

          - Update tarball URL to $VERSION
          - Update SHA256 checksum

          Auto-generated by GitHub Actions"

          git push origin main

      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"

          echo "## Homebrew Formula Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Formula updated successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256:** \`$SHA256\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Formula:** \`Formula/deepdiff-db.rb\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "brew tap iamvirul/deepdiff-db" >> $GITHUB_STEP_SUMMARY
          echo "brew install deepdiff-db" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Create PR comment (if triggered by release)
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const sha256 = '${{ steps.sha256.outputs.sha256 }}';

            const body = `## 🍺 Homebrew Formula Updated

            The Homebrew formula has been automatically updated for release ${version}.

            ### Installation
            \`\`\`bash
            brew tap iamvirul/deepdiff-db
            brew upgrade deepdiff-db
            \`\`\`

            ### Details
            - **Version:** ${version}
            - **SHA256:** \`${sha256}\`
            - **Commit:** ${context.sha.substring(0, 7)}
            `;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.release.id,
              body: body
            });
