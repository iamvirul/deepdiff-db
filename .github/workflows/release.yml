name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  macos-dmg:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: macos-latest
    needs: goreleaser   # wait for the release to be created first
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          go build \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o deepdiffdb \
            ./cmd/deepdiffdb

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DMG_NAME="deepdiff-db-${VERSION}-darwin-${{ matrix.arch }}.dmg"

          # --- staging folder ---
          mkdir -p dmg-stage
          cp deepdiffdb            dmg-stage/
          cp README.md             dmg-stage/
          cp deepdiffdb.config.yaml.example dmg-stage/

          # Simple install helper
          cat > dmg-stage/install.sh << 'INSTALL'
          #!/usr/bin/env bash
          set -e
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          DEST="/usr/local/bin/deepdiffdb"
          echo "Installing deepdiffdb → ${DEST}"
          sudo install -m 755 "${SCRIPT_DIR}/deepdiffdb" "${DEST}"
          echo "Installed: $(deepdiffdb --version)"
          INSTALL
          chmod +x dmg-stage/install.sh

          # Create read-only compressed DMG with hdiutil (built-in on macOS)
          hdiutil create \
            -volname "DeepDiff DB ${VERSION}" \
            -srcfolder dmg-stage \
            -ov \
            -format UDZO \
            "${DMG_NAME}"

          echo "DMG_NAME=${DMG_NAME}" >> "$GITHUB_ENV"

      - name: Upload DMG to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "${DMG_NAME}" --clobber
