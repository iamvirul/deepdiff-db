name: PR Required Checks

# This workflow ensures all critical checks pass before allowing merge
# Configure this as a required check in GitHub branch protection rules

on:
  pull_request:
    branches: [ main, development ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # This job waits for all critical checks to complete
  all-checks-pass:
    name: All Required Checks
    runs-on: ubuntu-latest
    # Skip if PR is in draft mode
    if: github.event.pull_request.draft == false

    steps:
      - name: Wait for CI workflows to complete
        uses: lewagon/wait-on-check-action@v1.3.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          running-workflow-name: 'All Required Checks'
          allowed-conclusions: success
          check-name: |
            Unit Tests (1.23)
            Unit Tests (1.24)
            Integration Tests
            Lint
            Build

      - name: All checks passed
        run: |
          echo "✅ All required checks have passed!"
          echo "This PR is ready to merge."

  # Validate PR title follows conventional commits
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
          requireScope: false
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            must start with an uppercase letter.

  # Ensure no merge conflicts
  check-merge-conflicts:
    name: Check for Merge Conflicts
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for merge conflicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch base branch
          git fetch origin ${{ github.event.pull_request.base.ref }}

          # Try to merge base into current branch
          if ! git merge --no-commit --no-ff origin/${{ github.event.pull_request.base.ref }}; then
            echo "❌ Merge conflicts detected!"
            echo "Please resolve conflicts before merging."
            git merge --abort
            exit 1
          fi

          echo "✅ No merge conflicts detected"
          git merge --abort

  # Check if tests were added for new features
  check-test-coverage:
    name: Ensure Tests Added
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for test files
        run: |
          echo "Checking if tests were added..."

          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD)

          # Check if any Go files were changed
          GO_FILES=$(echo "$CHANGED_FILES" | grep '\.go$' | grep -v '_test\.go$' || true)
          TEST_FILES=$(echo "$CHANGED_FILES" | grep '_test\.go$' || true)

          if [ -n "$GO_FILES" ] && [ -z "$TEST_FILES" ]; then
            echo "⚠️ Warning: Go files were modified but no test files were added."
            echo "Consider adding tests for your changes."
            # Don't fail, just warn
          else
            echo "✅ Tests present or no Go files modified"
          fi

  # Final summary job that all checks depend on
  required-checks-summary:
    name: Required Checks Summary
    runs-on: ubuntu-latest
    needs:
      - all-checks-pass
      - validate-pr-title
      - check-merge-conflicts
      - check-test-coverage
    if: always() && github.event.pull_request.draft == false

    steps:
      - name: Check all required jobs
        run: |
          echo "Checking status of all required jobs..."

          # Check if any required job failed
          if [[ "${{ needs.all-checks-pass.result }}" != "success" ]]; then
            echo "❌ CI checks failed"
            exit 1
          fi

          if [[ "${{ needs.validate-pr-title.result }}" != "success" ]]; then
            echo "❌ PR title validation failed"
            exit 1
          fi

          if [[ "${{ needs.check-merge-conflicts.result }}" != "success" ]]; then
            echo "❌ Merge conflicts detected"
            exit 1
          fi

          # Test coverage check is informational only

          echo "✅ All required checks passed!"
          echo "🎉 This PR is ready to be merged!"

  # Auto-label PR based on files changed
  auto-label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Label PR
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
