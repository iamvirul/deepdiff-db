version: '3.8'

services:
  # Production database with legacy tables
  prod-db:
    image: mysql:8.0
    container_name: deepdiff-tables-prod-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: testdb
    ports:
      - "3311:3306"
    volumes:
      - ./init-scripts/01-prod-schema.sql:/docker-entrypoint-initdb.d/01-prod-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      timeout: 5s
      retries: 10
      interval: 3s
    networks:
      - deepdiff-tables-network

  # Development database with new table structure
  dev-db:
    image: mysql:8.0
    container_name: deepdiff-tables-dev-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: testdb
    ports:
      - "3312:3306"
    volumes:
      - ./init-scripts/02-dev-schema.sql:/docker-entrypoint-initdb.d/02-dev-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      timeout: 5s
      retries: 10
      interval: 3s
    networks:
      - deepdiff-tables-network

networks:
  deepdiff-tables-network:
    driver: bridge
