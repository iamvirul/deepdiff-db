# DeepDiff DB Configuration - Safe Mode (Default)
# DROP INDEX statements are commented out for safety

prod:
  driver: mysql
  host: localhost
  port: 3309
  user: root
  password: rootpass
  database: testdb

dev:
  driver: mysql
  host: localhost
  port: 3310
  user: root
  password: rootpass
  database: testdb

output:
  dir: ./diff-output

# Migration settings (safe defaults)
# Drop operations are commented out by default
migration:
  allow_drop_column: false
  allow_drop_table: false
  allow_drop_index: false      # DROP INDEX statements will be commented
  confirm_destructive: true    # Show extra warnings for destructive operations
