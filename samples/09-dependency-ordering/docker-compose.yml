version: '3.8'

services:
  prod-db:
    image: mysql:8.0
    container_name: deepdiff-09-prod
    environment:
      MYSQL_ROOT_PASSWORD: prodpass
      MYSQL_DATABASE: prod_db
    ports:
      - "3315:3306"
    volumes:
      - ./init-scripts/01-prod-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  dev-db:
    image: mysql:8.0
    container_name: deepdiff-09-dev
    environment:
      MYSQL_ROOT_PASSWORD: devpass
      MYSQL_DATABASE: dev_db
    ports:
      - "3316:3306"
    volumes:
      - ./init-scripts/02-dev-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
