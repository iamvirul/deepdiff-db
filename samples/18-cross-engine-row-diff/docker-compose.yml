services:
  postgres:
    image: postgres:16-alpine
    container_name: sample18-postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: sample18-oracle
    environment:
      ORACLE_PASSWORD: secret
      APP_USER: appuser
      APP_USER_PASSWORD: secret
    ports:
      - "51521:1521"
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 45s
