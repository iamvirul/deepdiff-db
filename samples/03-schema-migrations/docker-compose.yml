version: '3.8'

services:
  db_prod:
    image: mysql:8.0
    container_name: mysql_schema_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
      MYSQL_ROOT_HOST: "%"
      MYSQL_AUTHENTICATION_PLUGIN: "mysql_native_password"
    ports:
      - "3320:3306"
    volumes:
      - ./init-scripts/init_prod.sql:/docker-entrypoint-initdb.d/init.sql
      - db_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      timeout: 20s
      retries: 10

  db_dev:
    image: mysql:8.0
    container_name: mysql_schema_dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
      MYSQL_ROOT_HOST: "%"
      MYSQL_AUTHENTICATION_PLUGIN: "mysql_native_password"
    ports:
      - "3321:3306"
    volumes:
      - ./init-scripts/init_dev.sql:/docker-entrypoint-initdb.d/init.sql
      - db_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      timeout: 20s
      retries: 10

volumes:
  db_prod_data:
  db_dev_data:
