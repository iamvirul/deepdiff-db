version: '3.8'

services:
  db_source:
    image: mysql:8.0
    container_name: mysql_db_source
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
      MYSQL_ROOT_HOST: "%"
      MYSQL_AUTHENTICATION_PLUGIN: "mysql_native_password"
    ports:
      - "3310:3306"
    volumes:
      - ./init-scripts/init_source.sql:/docker-entrypoint-initdb.d/init.sql
      - db_source_data:/var/lib/mysql

  db_target:
    image: mysql:8.0
    container_name: mysql_db_target
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
      MYSQL_ROOT_HOST: "%"
      MYSQL_AUTHENTICATION_PLUGIN: "mysql_native_password"
    ports:
      - "3311:3306"
    volumes:
      - ./init-scripts/init_target.sql:/docker-entrypoint-initdb.d/init.sql
      - db_target_data:/var/lib/mysql

  db_apply:
    image: mysql:8.0
    container_name: mysql_db_apply
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
      MYSQL_ROOT_HOST: "%"
      MYSQL_AUTHENTICATION_PLUGIN: "mysql_native_password"
    ports:
      - "3312:3306"
    volumes:
      - ./init-scripts/init_source.sql:/docker-entrypoint-initdb.d/init.sql
      - db_apply_data:/var/lib/mysql

volumes:
  db_source_data:
  db_target_data:
  db_apply_data:
