prod:
  driver: "oracle"
  host: "127.0.0.1"
  port: 1521
  user: "app_user"
  password: "AppPass123"
  database: "XEPDB1"           # Oracle service name (PDB)

dev:
  driver: "oracle"
  host: "127.0.0.1"
  port: 1522
  user: "app_user"
  password: "AppPass123"
  database: "XEPDB1"

ignore:
  tables: []
  columns:
    # Exclude timestamp columns so that minor clock drift between containers
    # does not generate false-positive content differences.
    - "*.ORDERED_AT"
    - "*.CREATED_AT"

output:
  dir: "./diff-output"

migration:
  allow_drop_column: false       # require explicit opt-in for destructive ops
  allow_drop_table: false
  allow_drop_index: false
  allow_drop_foreign_key: false
  allow_modify_primary_key: false
  confirm_destructive: false

conflict_resolution:
  default_strategy: "manual"
