version: '3.8'

services:
  # Production database with old schema (contains deprecated columns)
  prod-db:
    image: mysql:8.0
    container_name: deepdiff-prod-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: testdb
    ports:
      - "3307:3306"
    volumes:
      - ./init-scripts/01-prod-schema.sql:/docker-entrypoint-initdb.d/01-prod-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      timeout: 5s
      retries: 10
      interval: 3s
    networks:
      - deepdiff-network

  # Development database with new schema (cleaned up, deprecated columns removed)
  dev-db:
    image: mysql:8.0
    container_name: deepdiff-dev-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: testdb
    ports:
      - "3308:3306"
    volumes:
      - ./init-scripts/02-dev-schema.sql:/docker-entrypoint-initdb.d/02-dev-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      timeout: 5s
      retries: 10
      interval: 3s
    networks:
      - deepdiff-network

networks:
  deepdiff-network:
    driver: bridge
