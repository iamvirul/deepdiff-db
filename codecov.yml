codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 70%
        threshold: 1%
        base: auto
    patch:
      default:
        target: 60%
        threshold: 1%

comment:
  layout: "reach, diff, flags, files, footer"
  behavior: default
  require_changes: no

ignore:
  - "**/*_test.go"
  - "**/testdata/**"
  - "**/samples/**"
  - "**/scripts/**"
  - "cmd/deepdiffdb/main.go"  # CLI entry point, minimal logic

flags:
  unit-tests:
    paths:
      - internal/
      - pkg/
  integration-tests:
    paths:
      - internal/
      - pkg/
    carryforward: true

