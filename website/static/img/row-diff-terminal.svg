<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Window Container -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="860" height="440" rx="10" fill="url(#bg-grad)" stroke="#313244" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <path d="M 20 30 Q 20 20 30 20 L 870 20 Q 880 20 880 30 L 880 62 L 20 62 Z" fill="#11111b"/>
    <line x1="20" y1="62" x2="880" y2="62" stroke="#313244" stroke-width="1"/>
    
    <!-- Traffic lights -->
    <circle cx="45" cy="41" r="6" fill="#f38ba8"/>
    <circle cx="65" cy="41" r="6" fill="#f9e2af"/>
    <circle cx="85" cy="41" r="6" fill="#a6e3a1"/>
    
    <!-- Window Title -->
    <text x="450" y="45" fill="#a6adc8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle" font-weight="500">
      deepdiffdb row-diff — Cross-Engine Inspection
    </text>
  </g>

  <!-- Terminal Content -->
  <g font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" line-height="1.5">
    <!-- Command Line -->
    <text x="50" y="100" fill="#a6e3a1" font-weight="bold">$</text>
    <text x="70" y="100" fill="#cdd6f4" font-weight="bold">deepdiffdb row-diff --table customers --key 4</text>
    
    <!-- Box boundary top -->
    <text x="50" y="132" fill="#585b70">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>
    <text x="50" y="156" fill="#89b4fa" font-weight="bold">Table: </text>
    <text x="105" y="156" fill="#cdd6f4">customers </text>
    <text x="185" y="156" fill="#585b70">| </text>
    <text x="200" y="156" fill="#89b4fa" font-weight="bold">Key: </text>
    <text x="240" y="156" fill="#cdd6f4">4 </text>
    <rect x="260" y="142" width="76" height="20" rx="4" fill="rgba(249, 226, 175, 0.15)"/>
    <text x="268" y="156" fill="#fab387" font-weight="bold">updated</text>
    <text x="50" y="180" fill="#585b70">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>

    <!-- Table Header -->
    <text x="60" y="208" fill="#9399b2" font-weight="bold">Column</text>
    <text x="240" y="208" fill="#585b70">|</text>
    <text x="260" y="208" fill="#89dceb" font-weight="bold">Production (PostgreSQL)</text>
    <text x="540" y="208" fill="#585b70">|</text>
    <text x="560" y="208" fill="#cba6f7" font-weight="bold">Development (Oracle)</text>

    <!-- Table Divider -->
    <text x="60" y="228" fill="#45475a">--------------------+---------------------------+---------------------------</text>

    <!-- Row 1: country (matches) -->
    <text x="60" y="254" fill="#a6adc8">country</text>
    <text x="240" y="254" fill="#45475a">|</text>
    <text x="260" y="254" fill="#cdd6f4">FR</text>
    <text x="540" y="254" fill="#45475a">|</text>
    <text x="560" y="254" fill="#cdd6f4">FR</text>

    <!-- Row 2: email (DIFFERS - Highlighted) -->
    <rect x="52" y="266" width="796" height="28" rx="4" fill="rgba(243, 139, 168, 0.12)" stroke="rgba(243, 139, 168, 0.3)" stroke-width="1"/>
    <text x="60" y="285" fill="#f38ba8" font-weight="bold">email</text>
    <text x="240" y="285" fill="#45475a">|</text>
    <text x="260" y="285" fill="#f38ba8">dan@example.com</text>
    <text x="540" y="285" fill="#45475a">|</text>
    <text x="560" y="285" fill="#a6e3a1" font-weight="bold">dan+new@example.com</text>
    <text x="760" y="285" fill="#fab387" font-weight="bold">*</text>

    <!-- Row 3: id (matches) -->
    <text x="60" y="316" fill="#a6adc8">id</text>
    <text x="240" y="316" fill="#45475a">|</text>
    <text x="260" y="316" fill="#cdd6f4">4</text>
    <text x="540" y="316" fill="#45475a">|</text>
    <text x="560" y="316" fill="#cdd6f4">4</text>

    <!-- Row 4: name (matches) -->
    <text x="60" y="344" fill="#a6adc8">name</text>
    <text x="240" y="344" fill="#45475a">|</text>
    <text x="260" y="344" fill="#cdd6f4">Dan</text>
    <text x="540" y="344" fill="#45475a">|</text>
    <text x="560" y="344" fill="#cdd6f4">Dan</text>

    <!-- Legend -->
    <text x="60" y="380" fill="#fab387" font-weight="bold">*</text>
    <text x="75" y="380" fill="#6c7086" font-style="italic">indicates columns that differ across engines</text>
    <text x="50" y="404" fill="#585b70">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>

    <!-- Success Output -->
    <text x="50" y="430" fill="#a6e3a1">✓</text>
    <text x="68" y="430" fill="#a6adc8">1 row difference inspected (PostgreSQL "customers" ↔ Oracle "CUSTOMERS")</text>
  </g>
</svg>
